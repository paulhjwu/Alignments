<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lexicon Browser</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f7f7fa;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 820px;
      margin: 32px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 28px 38px;
    }
    h1.page-title {
      text-align: center;
      color: #2c3e50;
      margin: 0 0 22px;
      font-size: 1.55em;
      letter-spacing: 0.02em;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      background: #f2f6fc;
      border-radius: 8px;
      padding: 13px 16px;
      margin-bottom: 26px;
    }
    .lang-group label {
      margin-right: 14px;
      font-weight: 500;
      cursor: pointer;
      font-size: 0.97em;
    }
    .num-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .num-group input[type=number] {
      width: 80px;
      padding: 5px 8px;
      border: 1px solid #c8d0e0;
      border-radius: 5px;
      font-size: 0.95em;
    }
    .num-group input[type=text] {
      width: 140px;
      padding: 5px 8px;
      border: 1px solid #c8d0e0;
      border-radius: 5px;
      font-size: 0.95em;
    }
    button {
      padding: 5px 14px;
      border: none;
      border-radius: 5px;
      background: #2c7be5;
      color: #fff;
      cursor: pointer;
      font-size: 0.9em;
    }
    button:hover { background: #1a5dc4; }
    button:disabled { background: #b0b8c8; cursor: default; }
    .key-btn { background: #6c757d; }
    .key-btn:hover { background: #545b62; }
    .divider { width: 1px; height: 24px; background: #c8d0e0; margin: 0 4px; }

    /* Rendered markdown */
    .content { min-height: 200px; }
    .content h1 { font-size: 1.45em; color: #1a3a5c; margin: 0 0 4px; }
    .content h2 { font-size: 1.1em; color: #2c5282; margin: 18px 0 4px; }
    .content h3 { font-size: 0.88em; color: #2d6a4f; text-transform: uppercase;
                  letter-spacing: 0.06em; margin: 18px 0 6px; }
    .content p { line-height: 1.7; color: #333; margin: 7px 0; }
    .content ul { margin: 6px 0 6px 22px; padding: 0; }
    .content li { line-height: 1.6; color: #444; margin: 2px 0; }
    .content em { color: #555; font-style: italic; }
    .content code { background: #f0f4f8; padding: 1px 5px; border-radius: 3px;
                    font-size: 0.88em; font-family: monospace; }
    .content strong { color: #222; }
    .content table { border-collapse: collapse; width: 100%; margin: 14px 0; }
    .content th, .content td { border: 1px solid #dde3ee; padding: 7px 13px; text-align: left; }
    .content th { background: #f0f4f8; font-weight: 600; }
    .content hr { border: none; border-top: 1px solid #e5e8ef; margin: 16px 0; }
    .content a.lex-link { color: #2c7be5; text-decoration: none; font-weight: 500; }
    .content a.lex-link:hover { text-decoration: underline; }
    .error { color: #c0392b; padding: 14px 16px; background: #fdecea; border-radius: 6px; }
    .loading { color: #888; font-style: italic; }

    @media (max-width: 620px) {
      .container { margin: 10px; padding: 18px 16px; }
      .controls { flex-direction: column; align-items: flex-start; }
      .divider { display: none; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1 class="page-title">Lexicon Browser</h1>

  <div class="controls">
    <div class="lang-group">
      <label><input type="radio" name="lang" value="G" checked> Greek</label>
      <label><input type="radio" name="lang" value="H"> Hebrew</label>
    </div>
    <div class="divider"></div>
    <div class="num-group">
      <input type="number" id="numInput" min="1" value="1" placeholder="No.">
      <button id="goBtn">Go</button>
    </div>
    <div class="divider"></div>
    <div class="num-group">
      <button id="prevBtn" disabled>&#8592; Prev</button>
      <button id="nextBtn">Next &#8594;</button>
    </div>
    <div class="divider"></div>
    <button class="key-btn" id="keyBtn">View Key</button>
  </div>

  <div class="content" id="content">
    <p class="loading">Choose a language and number, then click Go — or click any entry below.</p>
  </div>
</div>

<script>
const MAX = { G: 5624, H: 8674 };

/* ---------- Markdown Renderer ---------- */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function inlineFmt(text) {
  let s = esc(text);
  // code spans (before other replacements to avoid double-processing)
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // bold
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // wiki-style cross-references [[Gxxx]], [[Hxxx]], [[lexicon-key]]
  s = s.replace(/\[\[([^\]]+)\]\]/g, (_, ref) =>
    `<a href="#${ref}" class="lex-link">${esc(ref)}</a>`
  );
  // italic (after link processing to avoid mangling)
  s = s.replace(/(?<![a-zA-Z])_([^_\n]+)_(?![a-zA-Z])/g, '<em>$1</em>');
  return s;
}

function renderTable(lines) {
  const dataLines = lines.filter(l => !/^\|[\s|:-]+\|$/.test(l.trim()));
  let html = '<table>';
  let isFirst = true;
  dataLines.forEach(row => {
    const cells = row.split('|').slice(1, -1).map(c => c.trim());
    if (isFirst) {
      html += '<thead><tr>' + cells.map(c => `<th>${inlineFmt(c)}</th>`).join('') + '</tr></thead><tbody>';
      isFirst = false;
    } else {
      html += '<tr>' + cells.map(c => `<td>${inlineFmt(c)}</td>`).join('') + '</tr>';
    }
  });
  html += '</tbody></table>';
  return html;
}

function renderList(lines) {
  let html = '';
  let depth = -1;
  lines.forEach(line => {
    if (!line.trim()) return;
    const indent = line.search(/\S/);
    const level = Math.floor(indent / 4);
    const text = line.replace(/^\s*-\s*/, '');
    if (level > depth) {
      while (depth < level) { html += '<ul>'; depth++; }
    } else if (level < depth) {
      while (depth > level) { html += '</ul>'; depth--; }
    }
    html += `<li>${inlineFmt(text)}</li>`;
  });
  while (depth >= 0) { html += '</ul>'; depth--; }
  return html;
}

function renderMarkdown(md) {
  const lines = md.split('\n');
  let html = '';
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // Heading
    const hm = line.match(/^(#{1,6})\s+(.+)$/);
    if (hm) {
      html += `<h${hm[1].length}>${inlineFmt(hm[2])}</h${hm[1].length}>`;
      i++; continue;
    }

    // Horizontal rule
    if (/^---+$/.test(line.trim())) {
      html += '<hr>';
      i++; continue;
    }

    // Table
    if (line.startsWith('|')) {
      const block = [];
      while (i < lines.length && lines[i].startsWith('|')) block.push(lines[i++]);
      html += renderTable(block);
      continue;
    }

    // List
    if (/^\s*-\s/.test(line)) {
      const block = [];
      while (i < lines.length &&
        (/^\s*-\s/.test(lines[i]) ||
          (lines[i].trim() === '' && i + 1 < lines.length && /^\s*-\s/.test(lines[i + 1])))) {
        block.push(lines[i++]);
      }
      html += renderList(block.filter(l => l.trim()));
      continue;
    }

    // Blank line
    if (!line.trim()) { i++; continue; }

    // Paragraph — collect until a block boundary
    const para = [];
    while (i < lines.length &&
      lines[i].trim() &&
      !lines[i].match(/^#{1,6}\s/) &&
      !lines[i].startsWith('|') &&
      !/^\s*-\s/.test(lines[i]) &&
      !/^---+$/.test(lines[i].trim())) {
      para.push(lines[i++]);
    }
    if (para.length) html += `<p>${inlineFmt(para.join(' '))}</p>`;
  }

  return html;
}

/* ---------- Load & Render ---------- */
async function loadEntry(ref) {
  const content = document.getElementById('content');
  content.innerHTML = '<p class="loading">Loading…</p>';

  let path, lang, num;

  if (ref === 'lexicon-key' || ref === 'key') {
    path = 'lexicon/lexicon-key.md';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
  } else {
    const m = String(ref).match(/^([GHgh])(\d+)$/);
    if (!m) {
      content.innerHTML = `<p class="error">Unknown reference: ${esc(ref)}</p>`;
      return;
    }
    lang = m[1].toUpperCase();
    num = parseInt(m[2], 10);
    const langDir = lang === 'G' ? 'greek' : 'hebrew';
    path = `lexicon/${langDir}/${lang}${num}.md`;

    // Sync controls
    document.querySelector(`input[name="lang"][value="${lang}"]`).checked = true;
    document.getElementById('numInput').value = num;
    document.getElementById('prevBtn').disabled = num <= 1;
    document.getElementById('nextBtn').disabled = num >= MAX[lang];
  }

  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error(`Entry not found: ${path}`);
    const md = await res.text();
    content.innerHTML = renderMarkdown(md);

    // Attach click handlers to cross-reference links
    content.querySelectorAll('a.lex-link').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        navigate(a.getAttribute('href').replace(/^#/, ''));
      });
    });
  } catch (err) {
    content.innerHTML = `<p class="error">${esc(err.message)}</p>`;
  }
}

/* ---------- Navigation ---------- */
function navigate(ref) {
  window.location.hash = ref;
}

window.addEventListener('hashchange', () => {
  const ref = window.location.hash.replace(/^#/, '');
  if (ref) loadEntry(ref);
});

/* ---------- Control Handlers ---------- */
document.getElementById('goBtn').addEventListener('click', () => {
  const lang = document.querySelector('input[name="lang"]:checked').value;
  const num  = parseInt(document.getElementById('numInput').value, 10);
  if (!num || num < 1) return;
  navigate(`${lang}${Math.min(num, MAX[lang])}`);
});

document.getElementById('numInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('goBtn').click();
});

document.getElementById('prevBtn').addEventListener('click', () => {
  const lang = document.querySelector('input[name="lang"]:checked').value;
  const num  = parseInt(document.getElementById('numInput').value, 10) - 1;
  if (num >= 1) navigate(`${lang}${num}`);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  const lang = document.querySelector('input[name="lang"]:checked').value;
  const num  = parseInt(document.getElementById('numInput').value, 10) + 1;
  if (num <= MAX[lang]) navigate(`${lang}${num}`);
});

document.getElementById('keyBtn').addEventListener('click', () => navigate('lexicon-key'));

document.querySelectorAll('input[name="lang"]').forEach(r => {
  r.addEventListener('change', () => {
    const lang = document.querySelector('input[name="lang"]:checked').value;
    const num  = parseInt(document.getElementById('numInput').value, 10) || 1;
    navigate(`${lang}${Math.min(num, MAX[lang])}`);
  });
});

/* ---------- Init ---------- */
const initRef = window.location.hash.replace(/^#/, '') || 'G1';
loadEntry(initRef);
</script>
</body>
</html>
