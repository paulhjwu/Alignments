---
# Applies the "Updating" procedure from ../plan2.md:
#   1. git pull in the checkout (git clone if repo_path doesn't exist yet)
#   2. rsync lexicon/ from this playbook's own local checkout (gitignored —
#      git pull above never brings it over; run this playbook from a checkout
#      that actually has lexicon/ present locally)
#   3. docker compose up -d — idempotent, so this single command works for
#      both a first deploy (creates the container) and routine updates
#      (Compose diffs the service/config itself and recreates only if
#      docker-compose.vps.yml or its inline Caddyfile actually changed;
#      no-ops otherwise)
#
# NOT covered by this playbook — do these once, manually, per plan2.md:
#   - pushing local commits to origin/main (this playbook only pulls)
#   - the one-time front-end Caddy wiring (joining workshop_default,
#     adding the /alignments/* route, recreating that container) — this
#     playbook never touches the existing treebank deployment
#
# Usage:
#   ansible-playbook -i srv1798889.hstgr.cloud, -u root ansible/update.yml
#
# (the trailing comma makes the hostname a one-off inventory; use a real
# inventory file and `hosts: alignments` group there if you prefer)

- name: Update alignments deployment
  hosts: all
  become: true

  vars:
    repo_url: git@github.com:paulhjwu/Alignments.git
    repo_path: /opt/alignments
    repo_version: main
    edge_network: workshop_default
    compose_file: docker-compose.vps.yml
    lexicon_local_path: "{{ playbook_dir }}/../lexicon/"

  tasks:
    - name: Pull latest changes
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_path }}"
        version: "{{ repo_version }}"
        update: true
        accept_hostkey: true
      register: git_pull

    - name: Sync lexicon/ (gitignored — git pull never brings this over)
      ansible.builtin.command:
        cmd: >-
          rsync -az --delete
          {{ lexicon_local_path }}
          {{ ansible_user | default('root') }}@{{ inventory_hostname }}:{{ repo_path }}/lexicon/
      delegate_to: localhost
      become: false
      register: lexicon_sync

    - name: Start/update the container
      ansible.builtin.command:
        cmd: docker compose -f {{ compose_file }} up -d
        chdir: "{{ repo_path }}"
      environment:
        EDGE_NETWORK: "{{ edge_network }}"
      register: compose_up

    - name: Summary
      ansible.builtin.debug:
        msg: "{{ compose_up.stderr_lines | default([]) }}"
